name: DevOps CI/CD Pipeline (Expt 5)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Lint, Test & Validate Build
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Git Repository (Expt 1)
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Test Backend API (Expt 4)
        run: |
          cd backend
          npm install
          npm test

      - name: 4. Build Frontend Bundle
        run: |
          cd frontend
          npm install
          npm run build

      - name: 5. Build Docker Images (Expt 2)
        run: |
          docker build -t shopsphere-backend:latest ./backend
          docker build -t shopsphere-frontend:latest ./frontend
